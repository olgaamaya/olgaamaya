<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="3;url=https://olgaamaya.com/index.html/#wrap_info_id">
    <title>About Page Redirect</title>
    <script>
        // Wait for the page to load, then adjust the display style of #wrap_info_id
        window.onload = function() {
            // Redirect after a delay
            setTimeout(function() {
                // Apply display: flex to #wrap_info_id after redirect
                var wrapInfo = document.getElementById('wrap_info_id');
                if (wrapInfo) {
                    wrapInfo.style.display = 'flex'; // Make it visible as flex
                }
            }, 1000); // Wait 3 seconds before executing the redirect
        }
    </script>
</head>

<body>
    <p>If you are not redirected, <a href="https://olgaamaya.com/index.html/#wrap_info_id">click here</a>.</p>
</body>

</html>
